<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<title>ttradar — TikTok トレンドレーダー</title>
<style>
/* ============================================================
   デザイントークン
   検証済みパレットに基づく。ライト/ダークは自動反転ではなく
   それぞれの面に対して選び直した値を使う。
   ============================================================ */
:root{
  color-scheme: light;
  --surface:#fcfcfb; --plane:#f9f9f7; --raised:#ffffff;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --series:#2a78d6; --series-wash:rgba(42,120,214,.10);
  --deemph:#c3c2b7;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --violet:#4a3aa7;
  --shadow:0 1px 2px rgba(11,11,11,.04), 0 8px 24px rgba(11,11,11,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface:#1a1a19; --plane:#0d0d0d; --raised:#212120;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --series:#3987e5; --series-wash:rgba(57,135,229,.14);
    --deemph:#4a4a46;
    --violet:#9085e9;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface:#1a1a19; --plane:#0d0d0d; --raised:#212120;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --series:#3987e5; --series-wash:rgba(57,135,229,.14);
  --deemph:#4a4a46;
  --violet:#9085e9;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
a{color:inherit}

/* ---------------------------------------------------------------- ヘッダー */
.top{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--plane) 88%,transparent);
  backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--border);
}
.top-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;font-size:15px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--series);
  box-shadow:0 0 0 4px var(--series-wash)}
.brand small{font-weight:500;color:var(--muted);font-size:11.5px;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.spacer{flex:1}
.ctl{display:flex;align-items:center;gap:7px}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
  background:var(--raised);border:1px solid var(--border);border-radius:9px;
  cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap;
  transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{border-color:var(--axis)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--series);border-color:transparent;color:#fff}
.btn.icon{width:32px;padding:0;justify-content:center}
select.btn{padding-right:8px;appearance:none;text-align:center}

/* ---------------------------------------------------------------- レイアウト */
.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 80px}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card-h{display:flex;align-items:baseline;gap:10px;padding:16px 18px 0}
.card-h h2{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.card-h p{margin:0;font-size:11.5px;color:var(--muted)}

/* ---------------------------------------------------------------- KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{padding:14px 16px}
.kpi .lab{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
.kpi .val{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.kpi .sub{font-size:11.5px;color:var(--muted)}
.kpi.accent .val{color:var(--good)}

/* ---------------------------------------------------------------- 機会マップ */
.map-card{margin-bottom:14px;overflow:hidden}
.map-body{padding:6px 18px 14px}
.map-legend{display:flex;flex-wrap:wrap;gap:14px;padding:0 18px 14px;font-size:11.5px;color:var(--ink-2)}
.map-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.map-note{font-size:11px;color:var(--muted);padding:0 18px 14px}

/* ---------------------------------------------------------------- フィルタ */
.filters{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  margin:0 0 12px; padding:10px 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
}
.tabs{display:flex;gap:3px;flex-wrap:wrap}
.tab{
  height:29px;padding:0 11px;border-radius:8px;border:1px solid transparent;
  background:transparent;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);
  transition:background .15s,color .15s;
}
.tab:hover{background:var(--plane)}
.tab[aria-selected="true"]{background:var(--series);color:#fff}
.tab .n{opacity:.6;margin-left:4px;font-size:11px}
.search{
  height:30px;padding:0 10px;min-width:150px;flex:1;max-width:240px;
  background:var(--plane);border:1px solid var(--border);border-radius:8px;font-size:12.5px;
}
.search:focus{outline:2px solid var(--series);outline-offset:-1px}

/* ---------------------------------------------------------------- 一覧 */
.rows{display:flex;flex-direction:column}
.row{
  display:grid; grid-template-columns:46px 96px 1fr 92px 82px 74px;
  gap:12px; align-items:center; padding:13px 16px; cursor:pointer;
  border-top:1px solid var(--border); transition:background .12s;
}
.row:first-child{border-top:none}
.row:hover{background:var(--plane)}
.row:focus-visible{outline:2px solid var(--series);outline-offset:-2px}
.rank{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}

/* スコアメーター: 単一比率 -> 同一ランプのトラック */
.meter{display:flex;flex-direction:column;gap:4px}
.meter b{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1}
.meter .track{height:4px;border-radius:2px;background:var(--grid);overflow:hidden}
.meter .fill{height:100%;border-radius:2px;background:var(--series);transition:width .4s cubic-bezier(.2,.8,.2,1)}

.nm{min-width:0}
.nm .t{font-weight:650;font-size:13.5px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .why{font-size:11.5px;color:var(--muted);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.chip{
  display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;
  border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap;
  background:var(--plane);color:var(--ink-2);border:1px solid var(--border);
}
.stage{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;white-space:nowrap}
.stage i{width:7px;height:7px;border-radius:50%;flex:none}
.s-emerging{color:var(--good)} .s-emerging i{background:var(--good)}
.s-rising{color:var(--series)} .s-rising i{background:var(--series)}
.s-new{color:var(--violet)} .s-new i{background:var(--violet)}
.s-stable{color:var(--muted)} .s-stable i{background:var(--muted)}
.s-peaking{color:var(--warning)} .s-peaking i{background:var(--warning)}
.s-declining{color:var(--critical)} .s-declining i{background:var(--critical)}

.num{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
.num .cap{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.up{color:var(--good)} .down{color:var(--critical)}
.spark{display:block}

/* ---------------------------------------------------------------- テーブル */
.tablewrap{overflow-x:auto;padding:4px 0 8px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
th{text-align:left;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.03em;
  padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
th.r,td.r{text-align:right}

/* ---------------------------------------------------------------- 詳細 */
.scrim{position:fixed;inset:0;background:rgba(11,11,11,.34);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);z-index:70;
  background:var(--surface);border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
}
.drawer.on{transform:none}
.drawer-h{padding:18px 20px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;gap:12px}
.drawer-h h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em}
.drawer-b{padding:18px 20px 40px;overflow-y:auto;flex:1}
.dsec{margin-bottom:22px}
.dsec h4{margin:0 0 9px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em}
/* 区切りはセル内側の影で描く。gap+背景色方式だと、最終行の余った
   グリッド領域が枠色のまま残って「空のセル」に見えてしまうため。 */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));
  background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.mgrid > div{padding:9px 11px;box-shadow:inset -1px -1px 0 var(--border)}
.mgrid .k{font-size:10.5px;color:var(--muted);font-weight:600}
.mgrid .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.reasons{list-style:none;margin:0;padding:0}
.reasons li{position:relative;padding:5px 0 5px 16px;font-size:12.5px;color:var(--ink-2);
  border-bottom:1px solid var(--border)}
.reasons li:last-child{border-bottom:none}
.reasons li::before{content:"";position:absolute;left:2px;top:13px;
  width:5px;height:5px;border-radius:50%;background:var(--series)}

/* ---------------------------------------------------------------- チャート */
.chart{width:100%;display:block;touch-action:none}
.tip{
  position:fixed;z-index:90;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--raised);border:1px solid var(--border);border-radius:9px;
  box-shadow:var(--shadow);padding:8px 10px;font-size:11.5px;max-width:250px;
}
.tip.on{opacity:1}
.tip b{display:block;font-size:12.5px;margin-bottom:2px}
.tip .r{color:var(--muted)}

/* ---------------------------------------------------------------- 状態 */
.empty{padding:52px 20px;text-align:center;color:var(--muted)}
.empty h3{margin:0 0 6px;font-size:15px;color:var(--ink)}
.empty code{background:var(--plane);padding:2px 7px;border-radius:5px;font-size:12px;
  border:1px solid var(--border)}
.banner{
  display:flex;gap:10px;align-items:flex-start;padding:11px 14px;margin-bottom:14px;
  background:var(--surface);border:1px solid var(--border);
  border-left:3px solid var(--warning);border-radius:10px;font-size:12px;color:var(--ink-2);
}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:95;
  background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;
  font-size:12.5px;font-weight:600;opacity:0;transition:all .22s;pointer-events:none;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{opacity:.45;transition:opacity .15s}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:640px){
  /* 狭い画面では日時ラベルがヘッダーを何行にも押し広げるので隠す */
  .brand small{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:860px){
  .row{grid-template-columns:34px 74px 1fr 76px;gap:9px}
  .row .hide-s{display:none}
  .drawer{width:100vw}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="dot"></span>ttradar
      <small id="regionLabel">JP</small>
    </div>
    <div class="spacer"></div>
    <div class="ctl">
      <select class="btn" id="windowSel" title="伸び率を測る比較窓">
        <option value="24">24時間</option>
        <option value="48">48時間</option>
        <option value="72" selected>72時間</option>
        <option value="168">7日間</option>
      </select>
      <button class="btn" id="collectBtn">収集する</button>
      <button class="btn icon" id="themeBtn" title="テーマ切替" aria-label="テーマ切替">◐</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>

  <section class="kpis" id="kpis" aria-label="サマリー"></section>

  <section class="card map-card" id="mapCard">
    <div class="card-h">
      <h2>機会マップ</h2>
      <p>横軸 = 競合の多さ ／ 縦軸 = 日次の伸び率 ／ 円の大きさ = スコア</p>
    </div>
    <div class="map-body"><svg id="scatter" class="chart" role="img"
      aria-label="競合の少なさと伸び率の散布図"></svg></div>
    <div class="map-legend">
      <span><i style="background:var(--series)"></i>狙い目（競合が少なく伸びている）</span>
      <span><i style="background:var(--deemph)"></i>その他</span>
    </div>
    <div class="map-note" id="mapNote"></div>
  </section>

  <div class="filters">
    <div class="tabs" id="typeTabs" role="tablist" aria-label="種別"></div>
    <select class="btn" id="stageSel" aria-label="ステージで絞る"></select>
    <input class="search" id="q" type="search" placeholder="名前・カテゴリで検索" aria-label="検索">
    <div class="spacer"></div>
    <button class="btn" id="viewBtn" aria-pressed="false">表形式</button>
  </div>

  <section class="card" id="listCard"><div class="rows" id="rows"></div></section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" tabindex="-1">
  <div class="drawer-h">
    <div style="flex:1;min-width:0">
      <h3 id="dTitle">—</h3>
      <div id="dMeta" style="font-size:11.5px;color:var(--muted);margin-top:3px"></div>
    </div>
    <button class="btn icon" id="closeBtn" aria-label="閉じる">✕</button>
  </div>
  <div class="drawer-b" id="dBody"></div>
</aside>

<div class="tip" id="tip" role="status"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================================================================
   ttradar フロントエンド
   外部依存なし。チャートは全て素の SVG を組み立てている。
   ================================================================ */

const S = {
  window: 72, type: "all", stage: "all", q: "",
  view: "cards", rows: [], summary: null, meta: null, jobTimer: null,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

/* ------------------------------------------------------------------ 書式 */
function fmtNum(v){
  if(v===null||v===undefined||Number.isNaN(v)) return "—";
  const n=Number(v);
  if(Math.abs(n)>=1e8) return (n/1e8).toFixed(1)+"億";
  if(Math.abs(n)>=1e4) return (n/1e4).toFixed(1)+"万";
  if(Math.abs(n)>=1000) return n.toLocaleString("ja-JP",{maximumFractionDigits:0});
  return n.toLocaleString("ja-JP",{maximumFractionDigits:n<10?1:0});
}
function fmtPct(v){
  if(v===null||v===undefined||Number.isNaN(v)) return "—";
  return (v>=0?"+":"")+Math.round(v*100)+"%";
}
function fmtTime(ts){
  if(!ts) return "—";
  const d=new Date(ts*1000);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
const TYPE_JA={product:"商品",hashtag:"ハッシュタグ",keyword:"キーワード",
  song:"楽曲",video:"動画",creator:"クリエイター"};
const METRIC_JA={views:"再生数",posts:"投稿数",likes:"いいね",comments:"コメント",
  shares:"シェア",followers:"フォロワー",sales:"販売数",revenue:"売上",price:"価格",
  rating:"評価",commission_rate:"報酬率",related_videos:"競合動画数",
  related_creators:"関連クリエイター",search_volume:"検索ボリューム",rank:"順位",
  ctr:"CTR",engagement_rate:"エンゲージ率"};
function fmtMetric(k,v){
  if(k==="commission_rate"||k==="ctr"||k==="engagement_rate") return Math.round(v*1000)/10+"%";
  if(k==="price") return "¥"+fmtNum(v);
  if(k==="rating") return Number(v).toFixed(1);
  return fmtNum(v);
}

/* ------------------------------------------------------------------ 通信 */
async function api(path){
  const r=await fetch(path,{headers:{"Accept":"application/json"}});
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).error || r.statusText);
  return r.json();
}
async function post(path,body){
  const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body||{})});
  return r.json();
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600);
}

/* ------------------------------------------------------------------ 描画: KPI */
function renderKpi(){
  const s=S.summary; if(!s) return;
  const c=s.stage_counts||{};
  const tiles=[
    {lab:"追跡中", val:s.total_entities, sub:`${s.capture_rounds} 回の収集`},
    {lab:"🚀 伸び始め", val:c.emerging||0, sub:"今すぐ狙える", accent:(c.emerging||0)>0},
    {lab:"📈 上昇中", val:c.rising||0, sub:"まだ間に合う"},
    {lab:"要チェック", val:s.alerts, sub:`スコア ${Math.round(s.alert_threshold)} 以上`},
  ];
  $("kpis").innerHTML=tiles.map(t=>`
    <div class="card kpi${t.accent?" accent":""}">
      <div class="lab">${esc(t.lab)}</div>
      <div class="val">${t.val}</div>
      <div class="sub">${esc(t.sub)}</div>
    </div>`).join("");
  $("regionLabel").textContent=s.region+" · 最終収集 "+fmtTime(s.last_capture);
}

/* ------------------------------------------------------------------ 描画: 銘柄バナー */
function renderBanner(){
  const s=S.summary; const b=$("banner");
  if(!s){b.innerHTML="";return;}
  if(s.total_entities===0){b.innerHTML="";return;}
  if(s.capture_rounds<2){
    b.innerHTML=`<div class="banner"><span>⏳</span><div>
      <b>まだ履歴が 1 回分しかありません。</b>
      伸び率は前回との差分で計算するため、現時点では「今の順位」しか出せません。
      時間を空けて数回「収集する」を押すと、伸び率・加速度・ステージ判定が有効になります。
    </div></div>`;
  } else if(s.insufficient_history>0){
    b.innerHTML=`<div class="banner"><span>ℹ️</span><div>
      ${s.insufficient_history} 件は履歴が不足しており伸び率を計算できていません。収集を重ねると精度が上がります。
    </div></div>`;
  } else b.innerHTML="";
}

/* ------------------------------------------------------------------ SVG 補助 */
const SVGNS="http://www.w3.org/2000/svg";

/* 目盛りをきりの良い数値にする (1/2/2.5/5 × 10^n).
   生の min/max を等分すると 6,526 のような読みにくい値になるため。 */
function niceTicks(lo,hi,count){
  if(!(hi>lo)) return [lo];
  const raw=(hi-lo)/Math.max(1,count);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;
  const step=(norm<=1?1:norm<=2?2:norm<=2.5?2.5:norm<=5?5:10)*mag;
  const start=Math.ceil(lo/step)*step;
  const out=[];
  for(let v=start; v<=hi+step*1e-9; v+=step) out.push(Math.abs(v)<step*1e-9?0:v);
  return out.length?out:[lo,hi];
}
function el(name,attrs,parent){
  const n=document.createElementNS(SVGNS,name);
  for(const k in attrs) if(attrs[k]!==null&&attrs[k]!==undefined) n.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function cssv(name){
  return getComputedStyle(document.body).getPropertyValue(name).trim();
}
function showTip(html,x,y){
  const t=$("tip"); t.innerHTML=html; t.classList.add("on");
  const r=t.getBoundingClientRect();
  let left=x+14, top=y-r.height-12;
  if(left+r.width>innerWidth-8) left=x-r.width-14;
  if(top<8) top=y+16;
  t.style.left=left+"px"; t.style.top=top+"px";
}
function hideTip(){ $("tip").classList.remove("on"); }

/* ------------------------------------------------------------------ 機会マップ
   形式: 散布図。強調(emphasis)で「狙い目」象限だけを主系列色、他は減色。
   カテゴリ配色を使わないので CVD 上の対立ペアが発生しない。       */
function renderScatter(){
  const svg=$("scatter");
  svg.innerHTML="";
  const pts=S.rows.filter(r=>{
    const c=competitionOf(r);
    return c!==null && r.growth_rate!==null && r.growth_rate!==undefined;
  });
  const excluded=S.rows.length-pts.length;
  $("mapNote").textContent = pts.length
    ? (excluded>0 ? `${excluded} 件は競合数が不明のため未表示です。` : "")
    : "競合数と伸び率の両方が揃ったデータがまだありません。収集を重ねると表示されます。";
  if(!pts.length){ svg.style.height="0px"; $("mapCard").style.display=S.rows.length?"":"none"; return; }
  $("mapCard").style.display="";

  const W=svg.clientWidth||900, H=320;
  const m={t:18,r:18,b:42,l:62};
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.style.height=H+"px";

  // x は競合数。桁が大きく違うので log スケール
  const xs=pts.map(p=>Math.max(1,competitionOf(p)));
  const ys=pts.map(p=>dailyOf(p));
  const xMin=Math.log10(Math.min(...xs)), xMaxR=Math.log10(Math.max(...xs));
  const xMax=xMaxR-xMin<0.3?xMin+0.3:xMaxR;
  const yLo=Math.min(0,Math.min(...ys)), yHiR=Math.max(...ys);
  const yHi=yHiR-yLo<0.1?yLo+0.1:yHiR;
  const pad=(yHi-yLo)*0.12;

  const X=v=>m.l+(Math.log10(Math.max(1,v))-xMin)/(xMax-xMin||1)*(W-m.l-m.r);
  const Y=v=>H-m.b-((v-(yLo-pad))/((yHi+pad)-(yLo-pad)||1))*(H-m.t-m.b);

  const grid=cssv("--grid"), axis=cssv("--axis"), muted=cssv("--muted");
  const series=cssv("--series"), deemph=cssv("--deemph"), surface=cssv("--surface");

  // 中央値で象限を割る
  const sorted=[...xs].sort((a,b)=>a-b);
  const xMed=sorted[Math.floor(sorted.length/2)];

  // 狙い目ゾーンの淡い下地
  el("rect",{x:m.l,y:m.t,width:Math.max(0,X(xMed)-m.l),height:Math.max(0,Y(0)-m.t),
    fill:"var(--series-wash)"},svg);
  const zoneLabel=el("text",{x:m.l+8,y:m.t+15,"font-size":10.5,"font-weight":700,
    fill:series,opacity:.85},svg);
  zoneLabel.textContent="狙い目ゾーン";
  // ラベル同士の衝突を避けるため、置いた矩形を覚えておく
  const placed=[{x1:m.l+4,y1:m.t+4,x2:m.l+76,y2:m.t+20}];
  const hits=(b)=>placed.some(p=>!(b.x2<p.x1||b.x1>p.x2||b.y2<p.y1||b.y1>p.y2));

  // グリッド: 実線ヘアライン
  for(const v of niceTicks(yLo-pad,yHi+pad,4)){
    const y=Y(v);
    el("line",{x1:m.l,y1:y,x2:W-m.r,y2:y,stroke:grid,"stroke-width":1},svg);
    el("text",{x:m.l-8,y:y+3.5,"text-anchor":"end","font-size":10,fill:muted},svg)
      .textContent=Math.round(v*100)+"%";
  }
  // 0% ライン (基準)
  el("line",{x1:m.l,y1:Y(0),x2:W-m.r,y2:Y(0),stroke:axis,"stroke-width":1},svg);
  // 競合の中央値ライン
  el("line",{x1:X(xMed),y1:m.t,x2:X(xMed),y2:H-m.b,stroke:axis,"stroke-width":1},svg);

  // x 軸 (log の目盛りをきりの良い値で)
  for(let e=0;e<=6;e++){
    const v=Math.pow(10,e);
    if(Math.log10(v)<xMin-0.05||Math.log10(v)>xMax+0.05) continue;
    el("text",{x:X(v),y:H-m.b+16,"text-anchor":"middle","font-size":10,fill:muted},svg)
      .textContent=fmtNum(v);
  }
  el("text",{x:(m.l+W-m.r)/2,y:H-4,"text-anchor":"middle","font-size":10.5,fill:muted},svg)
    .textContent="競合の多さ（関連動画・クリエイター数、対数スケール）";
  el("text",{"font-size":10.5,fill:muted,"text-anchor":"middle",
    transform:`translate(14 ${(m.t+(H-m.b))/2}) rotate(-90)`},svg)
    .textContent="日次の伸び率";

  // マーク: 面積をスコアに比例させる (半径ではなく面積)
  pts.sort((a,b)=>a.score-b.score);
  for(const p of pts){
    const c=competitionOf(p), g=dailyOf(p);
    const hot = c<=xMed && g>0;
    const r=4+Math.sqrt(Math.max(0,p.score)/100)*7;
    const g1=el("g",{},svg);
    // 2px の面色リングで重なりでも判別できるようにする
    el("circle",{cx:X(c),cy:Y(g),r:r,fill:hot?series:deemph,
      stroke:surface,"stroke-width":2,opacity:hot?1:.65},g1);
    // 当たり判定はマークより大きく (最小 24px 相当)
    const hit=el("circle",{cx:X(c),cy:Y(g),r:Math.max(r+6,12),fill:"transparent",
      style:"cursor:pointer"},g1);
    hit.addEventListener("mouseenter",ev=>showTip(
      `<b>${esc(p.name)}</b>
       <div class="r">${TYPE_JA[p.entity_type]||p.entity_type} · ${p.stage_emoji} ${esc(p.stage_label)}</div>
       <div class="r">スコア ${Math.round(p.score)} ／ 日次 ${fmtPct(g)} ／ 競合 ${fmtNum(c)}</div>`,
      ev.clientX,ev.clientY));
    hit.addEventListener("mouseleave",hideTip);
    hit.addEventListener("click",()=>openDetail(p.entity_key));
  }
  // 直接ラベルは上位数件のみ。全点に付けると読めなくなるうえ、
  // はみ出し・重なりが起きるので、収まる場合だけ描画する。
  const top=[...pts].sort((a,b)=>b.score-a.score).slice(0,4);
  for(const p of top){
    const c=competitionOf(p), g=dailyOf(p);
    const r=4+Math.sqrt(Math.max(0,p.score)/100)*7;
    const label=p.name.length>13?p.name.slice(0,12)+"…":p.name;
    const wpx=label.length*7.2;           // 日本語込みの概算幅
    let tx=X(c), ty=Y(g)-r-7;
    let anchor="middle";
    // 上に置けなければ下へ
    if(ty<m.t+11){ ty=Y(g)+r+13; }
    if(ty>H-m.b-2) continue;
    // 左右のはみ出しを内側に寄せる
    if(tx-wpx/2<m.l+2){ tx=m.l+2; anchor="start"; }
    else if(tx+wpx/2>W-m.r-2){ tx=W-m.r-2; anchor="end"; }
    const x1=anchor==="start"?tx:anchor==="end"?tx-wpx:tx-wpx/2;
    const box={x1,y1:ty-10,x2:x1+wpx,y2:ty+3};
    if(hits(box)) continue;               // 重なるなら諦める (ツールチップで読める)
    placed.push(box);
    const t=el("text",{x:tx,y:ty,"text-anchor":anchor,"font-size":10.5,
      "font-weight":700,fill:cssv("--ink-2")},svg);
    t.textContent=label;
  }
}
function competitionOf(r){
  const m=r.metrics||{};
  const v=(m.related_videos!==undefined)?m.related_videos:m.related_creators;
  return (v===undefined||v===null)?null:Number(v);
}
function dailyOf(r){
  if(r.growth_rate===null||r.growth_rate===undefined) return 0;
  const h=r.window_hours||S.window||24;
  return r.growth_rate*(24/Math.max(h,1));
}

/* ------------------------------------------------------------------ スパークライン */
function sparkSVG(vals){
  if(!vals||vals.length<2) return `<svg class="spark" width="62" height="22"></svg>`;
  const w=62,h=22,p=2;
  const lo=Math.min(...vals), hi=Math.max(...vals), rng=(hi-lo)||1;
  const pts=vals.map((v,i)=>{
    const x=p+(i/(vals.length-1))*(w-p*2);
    const y=h-p-((v-lo)/rng)*(h-p*2);
    return [x,y];
  });
  const d=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const area=`${d} L ${pts[pts.length-1][0].toFixed(1)} ${h-p} L ${pts[0][0].toFixed(1)} ${h-p} Z`;
  const last=pts[pts.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${area}" fill="var(--series-wash)"/>
    <path d="${d}" fill="none" stroke="var(--series)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6"
      fill="var(--series)" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}

/* ------------------------------------------------------------------ 詳細 */
async function openDetail(key){
  const row=S.rows.find(r=>r.entity_key===key);
  $("scrim").classList.add("on"); $("drawer").classList.add("on");
  $("drawer").focus();
  $("dTitle").textContent=row?row.name:"読み込み中…";
  $("dMeta").textContent=row?`${TYPE_JA[row.entity_type]||row.entity_type}${row.category?" · "+row.category:""}`:"";
  $("dBody").innerHTML=`<div class="empty">読み込み中…</div>`;
  try{
    const h=await api("/api/history?key="+encodeURIComponent(key));
    renderDetail(row,h);
  }catch(e){
    $("dBody").innerHTML=`<div class="empty"><h3>読み込めませんでした</h3><p>${esc(e.message)}</p></div>`;
  }
}
function closeDetail(){
  $("scrim").classList.remove("on"); $("drawer").classList.remove("on"); hideTip();
}
function renderDetail(row,h){
  const series=h.series.filter(p=>p.v!==null);
  const metrics=(series.length?series[series.length-1].metrics:{})||{};
  const mEntries=Object.entries(metrics).filter(([k,v])=>v!==null&&v!==undefined&&k!=="rank");

  $("dBody").innerHTML=`
    <div class="dsec">
      <h4>推移（${series.length} 回の観測）</h4>
      <svg id="dChart" class="chart" role="img" aria-label="時系列推移"></svg>
      <div id="dChartNote" style="font-size:11px;color:var(--muted);margin-top:6px"></div>
    </div>
    ${row?`<div class="dsec"><h4>評価</h4>
      <div class="mgrid">
        <div><div class="k">スコア</div><div class="v">${Math.round(row.score)}</div></div>
        <div><div class="k">ステージ</div><div class="v" style="font-size:13px">${row.stage_emoji} ${esc(row.stage_label)}</div></div>
        <div><div class="k">伸び率</div><div class="v">${fmtPct(row.growth_rate)}</div></div>
        <div><div class="k">日次換算</div><div class="v">${fmtPct(dailyOf(row))}</div></div>
      </div></div>`:""}
    ${mEntries.length?`<div class="dsec"><h4>指標</h4><div class="mgrid">
      ${mEntries.map(([k,v])=>`<div><div class="k">${esc(METRIC_JA[k]||k)}</div>
        <div class="v">${esc(fmtMetric(k,v))}</div></div>`).join("")}
    </div></div>`:""}
    ${row&&row.reasons&&row.reasons.length?`<div class="dsec"><h4>スコアの根拠</h4>
      <ul class="reasons">${row.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`:""}
    <div class="dsec">
      <h4>データ</h4>
      <div style="font-size:12px;color:var(--ink-2)">
        初回検出: ${fmtTime(h.first_seen)}<br>
        観測回数: ${series.length} 回
        ${h.url?`<br><a href="${esc(h.url)}" target="_blank" rel="noopener">TikTok で開く ↗</a>`:""}
      </div>
    </div>`;
  drawDetailChart(series);
}

/* 詳細チャート: 単一系列なので凡例は不要 (見出しが何かを示している).
   十字カーソル + ツールチップを既定で付ける。                       */
function drawDetailChart(series){
  const svg=$("dChart");
  svg.innerHTML="";
  const note=$("dChartNote");
  if(series.length<2){
    svg.style.height="0px";
    note.textContent="観測が 1 回のみのため推移を描画できません。収集を重ねると表示されます。";
    return;
  }
  note.textContent="";
  const W=svg.clientWidth||480, H=190, m={t:12,r:14,b:26,l:52};
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.style.height=H+"px";

  const ts=series.map(p=>p.t), vs=series.map(p=>p.v);
  const t0=Math.min(...ts), t1=Math.max(...ts);
  const lo=Math.min(...vs), hi=Math.max(...vs);
  const span=(hi-lo)||Math.max(hi*0.1,1);
  const yLo=Math.max(0,lo-span*0.15), yHi=hi+span*0.15;
  const X=t=>m.l+((t-t0)/((t1-t0)||1))*(W-m.l-m.r);
  const Y=v=>H-m.b-((v-yLo)/((yHi-yLo)||1))*(H-m.t-m.b);

  const grid=cssv("--grid"), muted=cssv("--muted"), series_c=cssv("--series");
  for(const v of niceTicks(yLo,yHi,4)){
    const y=Y(v);
    el("line",{x1:m.l,y1:y,x2:W-m.r,y2:y,stroke:grid,"stroke-width":1},svg);
    el("text",{x:m.l-8,y:y+3.5,"text-anchor":"end","font-size":10,fill:muted},svg)
      .textContent=fmtNum(v);
  }
  const pts=series.map(p=>[X(p.t),Y(p.v)]);
  const d=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  el("path",{d:`${d} L ${pts[pts.length-1][0].toFixed(1)} ${H-m.b} L ${pts[0][0].toFixed(1)} ${H-m.b} Z`,
    fill:"var(--series-wash)"},svg);
  el("path",{d:d,fill:"none",stroke:series_c,"stroke-width":2,
    "stroke-linejoin":"round","stroke-linecap":"round"},svg);

  // 終端だけ直接ラベル (全点に数値を置かない)
  const last=pts[pts.length-1];
  el("circle",{cx:last[0],cy:last[1],r:4.5,fill:series_c,
    stroke:cssv("--surface"),"stroke-width":2},svg);
  el("text",{x:Math.min(last[0]+8,W-m.r-4),y:Math.max(last[1]-8,m.t+9),
    "text-anchor":last[0]>W-70?"end":"start","font-size":11,"font-weight":700,
    fill:cssv("--ink")},svg).textContent=fmtNum(series[series.length-1].v);

  el("text",{x:m.l,y:H-6,"font-size":10,fill:muted},svg).textContent=fmtTime(t0);
  el("text",{x:W-m.r,y:H-6,"text-anchor":"end","font-size":10,fill:muted},svg).textContent=fmtTime(t1);

  // 十字カーソル
  const cross=el("line",{y1:m.t,y2:H-m.b,stroke:cssv("--axis"),"stroke-width":1,
    opacity:0},svg);
  const dot=el("circle",{r:5,fill:series_c,stroke:cssv("--surface"),"stroke-width":2,
    opacity:0},svg);
  const hit=el("rect",{x:m.l,y:m.t,width:Math.max(0,W-m.l-m.r),height:Math.max(0,H-m.t-m.b),
    fill:"transparent",style:"cursor:crosshair"},svg);
  function move(ev){
    const box=svg.getBoundingClientRect();
    const px=(ev.clientX-box.left)*(W/box.width);
    let best=0,bd=1e9;
    pts.forEach((q,i)=>{const dd=Math.abs(q[0]-px); if(dd<bd){bd=dd;best=i;}});
    const q=pts[best], p=series[best];
    cross.setAttribute("x1",q[0]); cross.setAttribute("x2",q[0]); cross.setAttribute("opacity",1);
    dot.setAttribute("cx",q[0]); dot.setAttribute("cy",q[1]); dot.setAttribute("opacity",1);
    showTip(`<b>${fmtNum(p.v)}</b><div class="r">${fmtTime(p.t)}</div>`,ev.clientX,ev.clientY);
  }
  hit.addEventListener("mousemove",move);
  hit.addEventListener("mouseleave",()=>{
    cross.setAttribute("opacity",0); dot.setAttribute("opacity",0); hideTip();
  });
}

/* ------------------------------------------------------------------ 読み込み */
async function load(){
  const host=$("listCard"); host.classList.add("loading");
  try{
    const qs=new URLSearchParams({window:S.window,type:S.type,stage:S.stage,q:S.q});
    const [sum,sig]=await Promise.all([
      api("/api/summary?window="+S.window),
      api("/api/signals?"+qs.toString()),
    ]);
    S.summary=sum; S.rows=sig.rows;
    renderKpi(); renderBanner(); renderTabs(); renderScatter(); renderList();
  }catch(e){
    $("rows").innerHTML=`<div class="empty"><h3>読み込めませんでした</h3>
      <p>${esc(e.message)}</p></div>`;
  }finally{ host.classList.remove("loading"); }
}

function renderTabs(){
  const counts=(S.summary&&S.summary.type_counts)||{};
  const items=[{value:"all",label:"すべて"}].concat(
    (S.meta.entity_types||[]).filter(t=>counts[t.value]));
  $("typeTabs").innerHTML=items.map(t=>{
    const n=t.value==="all"
      ? Object.values(counts).reduce((a,b)=>a+b,0)
      : counts[t.value];
    return `<button class="tab" role="tab" data-v="${t.value}"
      aria-selected="${S.type===t.value}">${esc(t.label)}<span class="n">${n||0}</span></button>`;
  }).join("");
  $("typeTabs").querySelectorAll(".tab").forEach(b=>{
    b.addEventListener("click",()=>{S.type=b.dataset.v; load();});
  });
}

/* ------------------------------------------------------------------ 初期化 */
async function init(){
  const saved=localStorage.getItem("ttradar-theme");
  if(saved) document.documentElement.setAttribute("data-theme",saved);
  try{ S.meta=await api("/api/meta"); }
  catch(e){ S.meta={entity_types:[],stages:[]}; }

  S.window=Number(S.meta.default_window)||72;
  const ws=$("windowSel");
  if(![...ws.options].some(o=>Number(o.value)===S.window)) S.window=72;
  ws.value=String(S.window);

  $("stageSel").innerHTML=`<option value="all">全ステージ</option>`+
    (S.meta.stages||[]).map(s=>`<option value="${s.value}">${s.emoji} ${s.label}</option>`).join("");

  ws.addEventListener("change",()=>{S.window=Number(ws.value); load();});
  $("stageSel").addEventListener("change",e=>{S.stage=e.target.value; load();});

  let qt=null;
  $("q").addEventListener("input",e=>{
    clearTimeout(qt); qt=setTimeout(()=>{S.q=e.target.value.trim(); load();},220);
  });

  $("viewBtn").addEventListener("click",()=>{
    S.view=S.view==="cards"?"table":"cards";
    $("viewBtn").textContent=S.view==="cards"?"表形式":"カード形式";
    $("viewBtn").setAttribute("aria-pressed",S.view==="table");
    renderList();
  });

  $("themeBtn").addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const next=cur==="dark"?"light":cur==="light"?"dark":
      (matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
    document.documentElement.setAttribute("data-theme",next);
    localStorage.setItem("ttradar-theme",next);
    renderScatter();
  });

  $("collectBtn").addEventListener("click",startCollect);
  $("closeBtn").addEventListener("click",closeDetail);
  $("scrim").addEventListener("click",closeDetail);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDetail(); });
  addEventListener("resize",()=>{ clearTimeout(window._rz);
    window._rz=setTimeout(renderScatter,180); });

  await load();
  pollJob();
}

async function startCollect(){
  const b=$("collectBtn");
  b.disabled=true; b.textContent="収集中…";
  const r=await post("/api/collect");
  if(!r.ok){ toast(r.reason||"収集を開始できませんでした"); }
  pollJob();
}
async function pollJob(){
  clearTimeout(S.jobTimer);
  let j;
  try{ j=await api("/api/job"); }catch(e){ return; }
  const b=$("collectBtn");
  if(j.running){
    b.disabled=true; b.textContent="収集中…";
    S.jobTimer=setTimeout(pollJob,1200);
    return;
  }
  b.disabled=false; b.textContent="収集する";
  if(j.finished && j.finished>(S._lastJob||0)){
    S._lastJob=j.finished;
    if(j.error) toast("収集に失敗: "+j.error);
    else if(j.result){
      const r=j.result;
      if(r.inserted>0) toast(`${r.inserted} 件を新規保存しました`);
      else if(r.errors&&r.errors.length) toast("取得できませんでした（doctor で確認）");
      else toast("新しいデータはありませんでした");
      await load();
    }
  }
}

init();
</script>
</body>
</html>
